[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iheart-cli"
version = "1.0.0"
description = "Command-line iHeart radio player"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "python-vlc",
]

[project.scripts]
iheart = "iheart.__main__:main"

[tool.setuptools.packages.find]
include = ["iheart*"]
